name: Update calendar
description: 'Update calendar content in given file'
inputs:
  calendar_url:
    description: 'Calendar to use - URL to ics file'
    required: true
  file:
    description: 'File to edit'


runs:
  using: composite
  steps:
  - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
    with:
      python-version: '3.14'
      cache: 'pip'
  - run: pip install -U -r "$GITHUB_ACTION_PATH/requirements.txt"
    shell: bash
  - run: python "$GITHUB_ACTION_PATH/update_calendar.py" "$TARGET_FILE" > index.html.new
    shell: bash
    env:
      CALENDAR_URL: ${{ inputs.calendar_url }}
      TARGET_FILE: ${{ inputs.file }}
  # Only rewrite original file if there's a difference other than blank lines'
  - run: |
      set +e
      diff -B "$TARGET_FILE" index.html.new
      if [[ $? > 0 ]]; then mv index.html.new "$TARGET_FILE"; else rm index.html.new; fi
    shell: bash
    env:
      TARGET_FILE: ${{ inputs.file }}
